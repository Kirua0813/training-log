<!doctype html>
<html lang="en" data-th="berserk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="theme-color" content="#050203">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Training Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English:ital@0;1&family=Share+Tech+Mono&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap">
<style>
:root{--rd:#d6232b;--rd2:#8e0f16;--bn:#e9dcc0;--mu:#8a7c68;--ln:#3a0b0e;--cy:#19e3ff;--pn:rgba(6,3,4,.88);--dim:.7;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{background:#050203;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--bn);font-family:var(--fb,"IM Fell English",Georgia,serif);font-size:18px;line-height:1.3;padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));min-height:100vh}
#bg{position:fixed;inset:0;z-index:-2;background:#050203 center/cover no-repeat}
#ov{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 35%,transparent 20%,#000000d9 120%),linear-gradient(rgba(3,1,2,calc(var(--dim) + var(--dx,0))),rgba(3,1,2,calc(var(--dim) + var(--dx,0) + .2)))}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,var(--sl,0)) 0 1px,transparent 1px 3px)}
.pn::before{content:"";position:absolute;top:-1px;right:-1px;width:16px;height:16px;border-top:2px solid var(--cy);border-right:2px solid var(--cy);pointer-events:none;filter:drop-shadow(0 0 4px var(--cy))}
.pn::after{content:"";position:absolute;bottom:-1px;left:-1px;width:16px;height:16px;border-bottom:2px solid var(--rd);border-left:2px solid var(--rd);pointer-events:none}
#rmlast{color:#ff6a62;border-color:var(--rd2)}
main{max-width:1000px;margin:0 auto;padding:10px}
.cz,.tl b,.sh td,input,select,.ph,.f span,.btn,nav button,.seg button,.sh th,.del,.hd h1{font-family:var(--fh,Cinzel,Georgia,serif)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
.hd h1{margin:0;display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:.18em;color:var(--bn);text-shadow:var(--gx,0px) 0 var(--cyf),calc(var(--gx,0px)*-1) 0 #d6232bcc,0 0 12px var(--rd2)}
.ec{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#000 52%,#ff5a50 58%,var(--rd) 66%,transparent 76%);box-shadow:0 0 14px var(--rd)}
.ic{background:var(--pn);border:1px solid var(--rd2);color:var(--rd);font-size:20px;width:42px;height:42px}
.pn{position:relative;background:var(--pn);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border:1px solid var(--ln);border-top:2px solid var(--rd2);box-shadow:inset 0 0 30px #000,0 6px 18px #000a;padding:10px;margin-bottom:10px}
.ph{font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--bn);margin:-10px -10px 10px;padding:9px 10px;background:repeating-linear-gradient(135deg,#1c0507 0 2px,#080203 2px 5px);border-bottom:1px solid var(--rd2)}
.ph::before{content:"◆";color:var(--cy);text-shadow:0 0 8px var(--cy);margin-right:8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:0 10px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.f{display:block}
.f span{display:block;font-weight:500;font-size:11.5px;letter-spacing:.1em;color:var(--mu);margin-bottom:3px}
.f em{display:block;font-size:14px;color:var(--mu);margin-top:2px}
input,select{width:100%;font-family:var(--fn,"Share Tech Mono",ui-monospace,monospace);font-size:18px;color:var(--bn);background:#000000b3;border:1px solid var(--ln);border-bottom:2px solid var(--rd2);border-radius:0;padding:10px;min-height:46px}
input::placeholder{color:#4d4338;font-style:italic}
input:focus,select:focus,button:focus-visible,textarea:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 0 14px var(--cyf)}
input[type=range]{padding:0;min-height:30px;accent-color:var(--rd);border:0;background:none}
textarea{width:100%;min-height:100px;background:#000000b3;color:var(--bn);border:1px solid var(--ln);padding:8px;font:13px/1.4 ui-monospace,Menlo,monospace}
.btn{display:block;width:100%;padding:15px;border:1px solid var(--rd);background:linear-gradient(#9c1119,#3f0407);color:var(--bn);font-weight:900;font-size:16px;letter-spacing:.24em;box-shadow:0 0 22px #8e0f16cc,inset 0 0 12px #000;margin-top:12px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.btn:active{filter:brightness(1.35)}
.btn.sec{background:#0b0405;border-color:var(--ln);color:var(--bn);font-size:12px;font-weight:700;letter-spacing:.14em;box-shadow:none;padding:11px;margin-top:6px;text-align:center}
.msg{margin-top:8px;text-align:center;color:var(--bn);font-style:italic;min-height:1.3em}.msg.er{color:#ff6a62}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.tl{background:#0000008c;border:1px solid var(--ln);border-left:2px solid var(--rd2);padding:6px 8px}
.tl span{display:block;font-size:13px;color:var(--mu);font-style:italic}
.tl b{font-family:var(--fn,"Share Tech Mono",ui-monospace,monospace);font-weight:400;font-size:21px;color:var(--bn);text-shadow:calc(var(--gx,0px)/2) 0 var(--cyf),calc(var(--gx,0px)/-2) 0 #d6232bcc,0 0 8px #d6232b88}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:9px 0;border:1px solid var(--ln);background:#000000b3;color:var(--mu);font-weight:700;font-size:11.5px;letter-spacing:.1em}
.seg button.on{background:var(--rd2);color:var(--bn);border-color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 0 14px var(--cyf)}
.mu{color:var(--mu);font-size:15px;font-style:italic;margin-top:6px}
.ch{width:100%;height:auto;display:block;margin-top:8px;background:#0000008c;border:1px solid var(--ln)}
.ax{display:flex;justify-content:space-between;font-size:12px;font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--mu);margin-top:3px}
.sc{overflow-x:auto}.sh{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.sh th{font-weight:500;font-size:10.5px;letter-spacing:.1em;color:var(--rd);text-align:right;padding:6px;border-bottom:1px solid var(--rd2)}.sh th:first-child{text-align:left}
.sh td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--ln);font-family:var(--fn,"Share Tech Mono",ui-monospace,monospace)}.sh td:first-child{text-align:left}
.del{background:none;border:1px solid var(--rd2);color:var(--rd);font-weight:700;font-size:10px;padding:5px 6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;overflow-x:auto;background:#050203;border-top:1px solid var(--rd2);box-shadow:0 -6px 22px #000;padding-bottom:env(safe-area-inset-bottom,0px);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;border:0;border-top:3px solid transparent;background:none;color:var(--mu);font-weight:700;font-size:11.5px;letter-spacing:.1em;padding:15px 14px}
nav button.on{color:var(--bn);border-top-color:var(--cy);background:#d6232b1f;text-shadow:0 0 10px var(--cy)}
.ic{display:grid;place-items:center;padding:0;cursor:pointer}.ic svg{width:22px;height:22px;display:block}
#th button{flex:1 1 30%;font-size:11px}
.tl small{display:block;font:12px "Share Tech Mono",ui-monospace,monospace;color:var(--mu)}
.tl small.ok{color:var(--bn)}.tl small.ok::before{content:"✓ "}
.tl small.no{color:#ff5a4f}.tl small.no::before{content:"✗ "}
:root[data-th="berserk"]{--cy:#e0262d;--cyf:#d6232b99;--fh:Cinzel,Georgia,serif;--fn:Cinzel,Georgia,serif;--fb:"IM Fell English",Georgia,serif}
[data-th="berserk"] .btn{clip-path:none}
:root[data-th="neon"]{--rd:#ff2040;--rd2:#a8112b;--cy:#ff6a85;--cyf:#ff6a8599;--bn:#ffeef0;--mu:#a0707a;--ln:#4d1424;--sl:.05;--gx:2px;--fh:Orbitron,sans-serif;--fn:"Share Tech Mono",monospace;--fb:Rajdhani,system-ui,sans-serif}
[data-th="neon"] body{font-size:19px}
[data-th="neon"] .pn{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
[data-th="neon"] .ph{background:linear-gradient(90deg,#5c0818,transparent 80%)}
[data-th="neon"] .btn{background:var(--rd);color:#0a0204;box-shadow:none}
:root[data-th="glitch"]{--rd:#ff1a1a;--rd2:#8a0b0b;--cy:#fff;--cyf:#ffffff88;--bn:#fff;--mu:#a37a7a;--ln:#4a1010;--sl:.1;--gx:3px;--dx:.08;--fh:Orbitron,sans-serif;--fn:"Share Tech Mono",monospace;--fb:Rajdhani,system-ui,sans-serif}
[data-th="glitch"] body{font-size:19px}
[data-th="glitch"] .pn{border:1px solid var(--rd);box-shadow:4px 4px 0 var(--rd2),-2px -2px 0 #ffffff1f}
[data-th="glitch"] .ph{background:var(--rd);color:#000;letter-spacing:.2em}
[data-th="glitch"] .ph::before{color:#000;text-shadow:none}
[data-th="glitch"] .btn{clip-path:none;background:#fff;color:#000;border-color:#fff;box-shadow:4px 4px 0 var(--rd)}
[data-th="glitch"] nav button.on{background:var(--rd);color:#000;text-shadow:none}
[data-th="glitch"] .hd h1{animation:fl 4s infinite}
@keyframes fl{0%,90%,100%{opacity:1;transform:none}92%{opacity:.35;transform:translateX(3px)}95%{opacity:.8;transform:translateX(-3px)}}
:root[data-th="terminal"]{--rd:#ff3b30;--rd2:#7d1812;--cy:#ff3b30;--cyf:#ff3b3066;--bn:#ff6b5f;--mu:#a1443d;--ln:#4a1511;--pn:rgba(3,0,0,.9);--sl:.07;--dx:.15;--fh:"Share Tech Mono",monospace;--fn:"Share Tech Mono",monospace;--fb:"Share Tech Mono",monospace}
[data-th="terminal"] body{font-size:16px}
[data-th="terminal"] .pn{border:1px solid var(--rd2);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
[data-th="terminal"] .pn::before,[data-th="terminal"] .pn::after,[data-th="terminal"] .ec{display:none}
[data-th="terminal"] .ph{background:none;border-bottom:1px dashed var(--rd2);letter-spacing:.06em;font-size:14px;text-transform:lowercase}
[data-th="terminal"] .ph::before{content:">";text-shadow:none}
[data-th="terminal"] .hd h1{font-size:17px;letter-spacing:.08em;text-shadow:0 0 6px var(--cyf)}
[data-th="terminal"] .hd h1::before{content:"root@log:~$";font-size:13px;color:var(--mu);margin-right:2px}
[data-th="terminal"] .hd h1::after{content:"█";animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
[data-th="terminal"] .btn{clip-path:none;background:#140302;box-shadow:none;letter-spacing:.12em}
[data-th="terminal"] .tl{border:1px solid var(--ln)}
:root[data-th="blackout"]{--rd:#d3122f;--rd2:#5c0a14;--cy:#d3122f;--cyf:#d3122f44;--bn:#d4cccc;--mu:#76605f;--ln:#2b1215;--pn:rgba(0,0,0,.93);--sl:0;--dx:.3;--fh:Rajdhani,sans-serif;--fn:"Share Tech Mono",monospace;--fb:Rajdhani,system-ui,sans-serif}
[data-th="blackout"] .pn{border:1px solid var(--ln);border-top:1px solid var(--rd);box-shadow:none;padding:8px}
[data-th="blackout"] .pn::before,[data-th="blackout"] .pn::after{display:none}
[data-th="blackout"] .ph{background:none;border-bottom:1px solid var(--ln);color:var(--rd);font-size:11px;letter-spacing:.28em;margin:-8px -8px 8px;padding:8px}
[data-th="blackout"] .ph::before{content:"//";text-shadow:none;color:var(--mu)}
[data-th="blackout"] .ec{width:10px;height:10px;border-radius:0;background:var(--rd);box-shadow:none}
[data-th="blackout"] .btn{clip-path:none;background:var(--rd);color:#000;box-shadow:none;letter-spacing:.32em;font-size:14px}
[data-th="blackout"] .tl{border:0;border-bottom:1px solid var(--rd2);background:none}
[data-th="blackout"] .tl b{text-shadow:none;color:#fff}
[data-th="blackout"] .hd h1{text-shadow:none;font-size:17px;letter-spacing:.3em;font-weight:700}
@media (prefers-reduced-motion:reduce){.hd h1,.hd h1::after{animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="bg"></div><div id="ov"></div>
<main>
  <div class="hd"><h1><span class="ec"></span>TRAINING LOG</h1><button class="ic" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
  <section id="cfg" class="pn" hidden>
    <div class="ph">DAILY GOALS</div><div class="fg" id="goals"></div><div class="mu">Leave a field empty for no goal. Calories, macros and creatine count as met within 10% of the goal, sleep when at or above it, weight within 0.5 kg of the target.</div><div class="ph" style="margin-top:12px">STYLE</div><div class="seg" id="th" style="flex-wrap:wrap;margin-bottom:12px"></div><div class="ph" style="margin-top:6px">BACKGROUND</div>
    <label class="btn sec">CHOOSE IMAGE<input id="img" type="file" accept="image/*" hidden></label>
    <label class="f" style="margin-top:10px"><span>DARKNESS</span><input id="dim" type="range" min="35" max="95" value="70"></label>
    <button class="btn sec" id="rmbg">RESET TO DEFAULT WALLPAPER</button>
    <div class="msg" id="mb" role="status"></div>
  </section>
  <section id="v-Entry">
    <div class="pn">
      <div class="ph">DAILY ENTRY</div>
      <div class="fg">
        <label class="f"><span>TRAINED?</span><select id="t"><option value="">Choose…</option><option>Yes</option><option>No</option></select></label>
        <label class="f"><span>DATE</span><input id="d" type="date"></label>
        <label class="f"><span>CALORIES (kcal)</span><input id="c" inputmode="decimal" placeholder="2500"></label>
        <label class="f"><span>CREATINE (g)</span><input id="k" inputmode="decimal" placeholder="5"></label>
        <label class="f"><span>PROTEIN (g)</span><input id="pr" inputmode="decimal" placeholder="150"></label>
        <label class="f"><span>FAT (g)</span><input id="ft" inputmode="decimal" placeholder="70"></label>
        <label class="f"><span>CARBS (g)</span><input id="cb" inputmode="decimal" placeholder="250"></label>
        <label class="f"><span>WEIGHT AFTER WORKOUT (kg)</span><input id="p" inputmode="decimal" placeholder="78.5"><em>Empty = repeats previous day</em></label>
        <label class="f"><span>SLEEP (h)</span><input id="s" inputmode="decimal" placeholder="7.5"><em>Optional</em></label>
      </div>
      <button class="btn" id="add">ADD ENTRY</button>
      <div class="msg" id="m" role="status"></div>
    </div>
    <div class="pn"><div class="ph">LAST ENTRY</div><div class="tg" id="last"></div><button class="btn sec" id="rmlast">REMOVE LAST ENTRY</button><div class="msg" id="m3" role="status"></div></div>
  </section>
  <section id="dyn" hidden></section>
</main>

const K='treino_v1',KB='treino_bg',KD='treino_dim',$=i=>document.getElementById(i),TABS=['Entry','Summary','Weight','Calories','Creatine','Protein','Fat','Carbs','Training','Sleep','Data'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let D=[],P='Month',del=null,cur='Entry';
try{D=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){D=[]}
D.forEach(r=>{if(r.t==='Sim')r.t='Yes';if(r.t==='Não')r.t='No'});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const isN=x=>typeof x==='number'&&isFinite(x);
const fmt=(x,n=1)=>isN(x)?x.toLocaleString('en-US',{maximumFractionDigits:n}):'–';
const fd=d=>{const a=d.split('-');return +a[2]+' '+MON[a[1]-1]+' '+a[0]};
const U=d=>new Date(d+'T00:00:00Z'),iso=u=>u.toISOString().slice(0,10);
const addD=(d,n)=>{const u=U(d);u.setUTCDate(u.getUTCDate()+n);return iso(u)};
const addM=(d,n)=>{const u=U(d);u.setUTCMonth(u.getUTCMonth()+n);return iso(u)};
const today=()=>{const t=new Date();return iso(new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())))};
const nextDate=()=>D.length?addD(D[D.length-1].d,1):today();
const num=v=>{v=String(v).trim().replace(',','.');if(v==='')return null;const n=Number(v);return isFinite(n)?n:NaN};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN,sum=a=>a.reduce((x,y)=>x+y,0),mm=(a,f)=>a.length?Math[f](...a):NaN;
const msg=(el,t,er)=>{el.textContent=t;el.className='msg'+(er?' er':'')};

/* background */
const setBg=u=>{$('bg').style.backgroundImage=`url("${u}")`};
const setDim=v=>document.documentElement.style.setProperty('--dim',v/100);
let sb=null,sd=null;try{sb=localStorage.getItem(KB);sd=localStorage.getItem(KD)}catch(e){}
setBg(sb||DEF);if(sd){setDim(+sd);$('dim').value=sd}else setDim(70);
$('gear').onclick=()=>{$('cfg').hidden=!$('cfg').hidden};
$('dim').oninput=e=>{setDim(e.target.value);try{localStorage.setItem(KD,e.target.value)}catch(x){}};
$('rmbg').onclick=()=>{setBg(DEF);try{localStorage.removeItem(KB)}catch(e){}msg($('mb'),'Default wallpaper restored.')};
$('img').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const u=c.toDataURL('image/jpeg',.7);setBg(u);
      try{localStorage.setItem(KB,u);msg($('mb'),'Background applied.')}catch(x){msg($('mb'),'Applied, but it did not fit in storage and will reset when you close the app.',1)}
    };
    im.onerror=()=>msg($('mb'),'Could not read that image.',1);
    im.src=r.result};
  r.readAsDataURL(f);
};

/* goals */
const GK='treino_goals',KEY={Weight:'p',Calories:'c',Creatine:'k',Protein:'pr',Fat:'ft',Carbs:'cb',Sleep:'s'};
let G={};try{G=JSON.parse(localStorage.getItem(GK)||'{}')}catch(e){G={}}
const GF=[['c','Calories (kcal)'],['pr','Protein (g)'],['ft','Fat (g)'],['cb','Carbs (g)'],['k','Creatine (g)'],['s','Sleep (h)'],['p','Target weight (kg)'],['w','Workouts per week']];
const hit=(k,v)=>{const g=G[k];if(!isN(g)||!isN(v))return false;return k==='s'?v>=g:k==='p'?Math.abs(v-g)<=.5:Math.abs(v-g)<=g*.1};
const gt=(k,v)=>isN(G[k])&&isN(v)?[(k==='p'?'target ':'goal ')+fmt(G[k],1)+(k==='s'?'+':''),hit(k,v)?'ok':'no']:['',''];
function stats(n,R){
  const a=stats0(n,R),k=KEY[n];
  if(n==='Training'){const tr=R.filter(r=>r.t==='Yes').length;a.push(['Per week',R.length?fmt(tr/R.length*7):'–']);if(isN(G.w))a.push(['Goal / week',fmt(G.w,1)]);return a}
  if(!isN(G[k]))return a;
  if(n==='Weight'){const cu=R.map(r=>r.p).filter(isN).pop();a.push(['Target',fmt(G.p)]);a.push(['To target',isN(cu)?(cu-G.p>0?'+':'')+fmt(cu-G.p):'–']);return a}
  const v=R.map(r=>r[k]).filter(isN);
  a.push(['Goal'+(n==='Sleep'?' h':n==='Calories'?'':' g'),fmt(G[k],1)]);
  a.push(['Days on goal',v.length?v.filter(x=>hit(k,x)).length+'/'+v.length:'–']);
  return a;
}
$('goals').innerHTML=GF.map(x=>`<label class="f"><span>${x[1].toUpperCase()}</span><input data-g="${x[0]}" inputmode="decimal" placeholder="–" value="${isN(G[x[0]])?G[x[0]]:''}"></label>`).join('');
$('goals').querySelectorAll('input').forEach(i=>i.oninput=()=>{
  const n=num(i.value);
  if(n===null||Number.isNaN(n)||n<0)delete G[i.dataset.g];else G[i.dataset.g]=n;
  try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}
  lastRec();if(cur!=='Entry')draw();
});

/* styles */
const THS=['berserk','neon','glitch','terminal','blackout'];
function setTh(t){
  const th=THS.includes(t)?t:'berserk';
  document.documentElement.dataset.th=th;
  $('th').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===th));
  try{localStorage.setItem('treino_th',th)}catch(e){}
}
$('th').innerHTML=THS.map(t=>`<button data-t="${t}">${t.toUpperCase()}</button>`).join('');
$('th').querySelectorAll('button').forEach(b=>b.onclick=()=>setTh(b.dataset.t));
let th0='berserk';try{th0=localStorage.getItem('treino_th')||'berserk'}catch(e){}
setTh(th0);

/* tabs */
$('tabs').innerHTML=TABS.map(t=>`<button data-t="${t}">${t.toUpperCase()}</button>`).join('');
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
function go(t){
  cur=t;del=null;
  $('tabs').querySelectorAll('button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);if(on)b.scrollIntoView({inline:'center',block:'nearest'})});
  $('v-Entry').hidden=t!=='Entry';$('dyn').hidden=t==='Entry';
  if(t==='Entry')lastRec();else draw();
  window.scrollTo(0,0);
}
const tiles=a=>a.map(x=>`<div class="tl"><span>${x[0]}</span><b>${x[1]}</b>${x[2]?`<small class="${x[3]}">${x[2]}</small>`:''}</div>`).join('');
function lastRec(){
  const r=D[D.length-1];
  $('last').innerHTML=r?tiles([['Date',fd(r.d)],['Trained?',r.t],['kcal',fmt(r.c,0),...gt('c',r.c)],['Creatine g',fmt(r.k),...gt('k',r.k)],['Protein g',fmt(r.pr),...gt('pr',r.pr)],['Fat g',fmt(r.ft),...gt('ft',r.ft)],['Carbs g',fmt(r.cb),...gt('cb',r.cb)],['Weight kg',fmt(r.p),...gt('p',r.p)],['Sleep h',fmt(r.s),...gt('s',r.s)]]):'<div class="mu">No entries yet.</div>';
}
const reset=()=>{$('t').value='';['c','k','pr','ft','cb','p','s'].forEach(i=>$(i).value='');$('d').value=nextDate()};

$('add').onclick=()=>{
  const m=$('m'),t=$('t').value,d=$('d').value,v={};
  if(t!=='Yes'&&t!=='No')return msg(m,'Choose Yes or No in “Trained?”.',1);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return msg(m,'Invalid date. Pick a date.',1);
  for(const k of['c','k','pr','ft','cb','p','s']){v[k]=num($(k).value);if(Number.isNaN(v[k]))return msg(m,'Numbers only (dot or comma for decimals).',1)}
  if(isN(v.s)&&(v.s<0||v.s>24))return msg(m,'Sleep must be between 0 and 24 hours.',1);
  if([v.c,v.k,v.pr,v.ft,v.cb,v.p].some(x=>isN(x)&&x<0))return msg(m,'Use positive values only.',1);
  if(D.length>=2000)return msg(m,'Limit of 2000 entries reached.',1);
  if(D.some(r=>r.d===d))return msg(m,'An entry for '+fd(d)+' already exists. Change the date or delete the old one in Data.',1);
  let nota='';
  if(v.p===null){const pv=[...D].reverse().find(r=>r.d<d&&isN(r.p));if(pv){v.p=pv.p;nota=' (weight carried over from the previous day)'}}
  D.push({d,t,c:v.c,k:v.k,pr:v.pr,ft:v.ft,cb:v.cb,p:v.p,s:v.s});D.sort((a,b)=>a.d<b.d?-1:1);
  save();reset();lastRec();
  msg(m,'Entry for '+fd(d)+' added successfully'+nota+'.');
};

let armed=false;
$('rmlast').onclick=()=>{
  const b=$('rmlast');
  if(!D.length)return msg($('m3'),'Nothing to remove.',1);
  if(!armed){armed=true;b.textContent='TAP AGAIN TO REMOVE '+fd(D[D.length-1].d).toUpperCase();setTimeout(()=>{if(armed){armed=false;b.textContent='REMOVE LAST ENTRY'}},4000);return}
  const r=D.pop();armed=false;b.textContent='REMOVE LAST ENTRY';save();reset();lastRec();msg($('m3'),'Entry for '+fd(r.d)+' removed.');
};

/* metrics */
const MET={Weight:['WEIGHT AFTER WORKOUT','p',0],Calories:['CALORIES CONSUMED','c',1],Creatine:['CREATINE CONSUMED','k',1],Protein:['PROTEIN CONSUMED','pr',1],Fat:['FAT CONSUMED','ft',1],Carbs:['CARBS CONSUMED','cb',1],Training:['TRAINING DAYS','tv',1],Sleep:['HOURS OF SLEEP','s',0]};
function view(){
  if(!D.length)return{R:[],from:null};
  const mx=D[D.length-1].d,from=P==='Week'?addD(mx,-6):P==='Month'?addD(addM(mx,-1),1):P==='Year'?addD(addM(mx,-12),1):D[0].d;
  return{from,R:D.filter(r=>r.d>=from).map(r=>({...r,tv:r.t==='Yes'?1:0}))};
}
function stats0(n,R){
  const col=k=>R.map(r=>r[k]).filter(isN),pe=col('p'),ca=col('c'),cr=col('k'),so=col('s'),pr=col('pr'),ft=col('ft'),cb=col('cb'),tr=R.filter(r=>r.t==='Yes').length,dv=pe.length?pe[pe.length-1]-pe[0]:NaN;
  if(n==='Weight')return[['Start',fmt(pe[0])],['Current',fmt(pe[pe.length-1])],['Change',isN(dv)?(dv>0?'+':'')+fmt(dv):'–'],['Min',fmt(mm(pe,'min'))],['Max',fmt(mm(pe,'max'))],['Average',fmt(avg(pe))]];
  if(n==='Calories')return[['Avg / day',fmt(avg(ca),0)],['Max',fmt(mm(ca,'max'),0)],['Total',fmt(sum(ca),0)]];
  if(n==='Creatine')return[['Avg / day g',fmt(avg(cr))],['Total g',fmt(sum(cr))]];
  if(n==='Protein')return[['Avg / day g',fmt(avg(pr))],['Max g',fmt(mm(pr,'max'))],['Total g',fmt(sum(pr))]];
  if(n==='Fat')return[['Avg / day g',fmt(avg(ft))],['Max g',fmt(mm(ft,'max'))],['Total g',fmt(sum(ft))]];
  if(n==='Carbs')return[['Avg / day g',fmt(avg(cb))],['Max g',fmt(mm(cb,'max'))],['Total g',fmt(sum(cb))]];
  if(n==='Training')return[['Workouts',tr],['Days logged',R.length],['Frequency',R.length?fmt(tr/R.length*100,0)+'%':'–']];
  return[['Average h',fmt(avg(so))],['Min',fmt(mm(so,'min'))],['Max',fmt(mm(so,'max'))]];
}
function chart(R,key,bar,H,goal){
  const pts=R.filter(r=>isN(r[key]));
  if(pts.length<2)return '<div class="mu">Not enough data for a chart yet.</div>';
  const W=320,Q=10,ys=pts.map(r=>r[key]),n=pts.length;
  let lo=bar?0:Math.min(...ys),hi=Math.max(...ys);
  if(isN(goal)){hi=Math.max(hi,goal);if(!bar)lo=Math.min(lo,goal)}
  if(hi===lo){hi+=1;if(!bar)lo-=1}
  const sx=i=>Q+i*(W-2*Q)/(n-1),sy=y=>H-Q-(y-lo)/(hi-lo)*(H-2*Q);
  let g=[1,2,3].map(i=>`<line x1="0" x2="${W}" y1="${H*i/4}" y2="${H*i/4}" style="stroke:var(--ln)" stroke-width=".7"/>`).join('');
  if(bar){const bw=Math.max(1,(W-2*Q)/n*.62);g+=pts.map((r,i)=>`<rect x="${(sx(i)-bw/2).toFixed(1)}" y="${sy(r[key]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-Q-sy(r[key])).toFixed(1)}" style="fill:var(--rd)"/>`).join('')}
  else{const L=pts.map((r,i)=>sx(i).toFixed(1)+','+sy(r[key]).toFixed(1)).join(' ');
    g+=`<polygon points="${Q},${H-Q} ${L} ${W-Q},${H-Q}" style="fill:var(--cyf);fill-opacity:.3"/><polyline fill="none" style="stroke:var(--cy)" stroke-width="2" stroke-linejoin="round" points="${L}"/>`+(n<=45?pts.map((r,i)=>`<circle cx="${sx(i).toFixed(1)}" cy="${sy(r[key]).toFixed(1)}" r="2.6" style="fill:var(--bn)"/>`).join(''):'')}
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart">${g}${isN(goal)?`<line x1="0" x2="${W}" y1="${sy(goal).toFixed(1)}" y2="${sy(goal).toFixed(1)}" stroke-dasharray="5 4" stroke-width="1.2" style="stroke:var(--bn)"/>`:''}</svg><div class="ax"><span>${fd(pts[0].d)}</span><span>${fmt(lo)} to ${fmt(hi)}</span><span>${fd(pts[n-1].d)}</span></div>`;
}
const card=(n,R,H)=>`<div class="pn"><div class="ph">${MET[n][0]}</div><div class="tg">${tiles(stats(n,R))}</div>${chart(R,MET[n][1],MET[n][2],H,G[KEY[n]])}</div>`;
function draw(){
  const el=$('dyn'),{R,from}=view();let h='';
  const per=`<div class="pn"><div class="seg">${['Week','Month','Year','All'].map(p=>`<button data-p="${p}" class="${p===P?'on':''}">${p.toUpperCase()}</button>`).join('')}</div><div class="mu">${R.length} days in period${from?' · from '+fd(from):''}</div></div>`;
  if(cur==='Summary')h=per+`<div class="g">${Object.keys(MET).map(n=>card(n,R,100)).join('')}</div>`;
  else if(MET[cur])h=per+card(cur,R,170);
  else{
    h=`<div class="pn"><div class="ph">DATA</div>`+(D.length?`<div class="sc"><table class="sh"><tr><th>DATE</th><th>TRAINED</th><th>KCAL</th><th>CREAT</th><th>PROT</th><th>FAT</th><th>CARB</th><th>WEIGHT</th><th>SLEEP</th><th></th></tr>`+
    [...D].reverse().map(r=>`<tr><td>${fd(r.d)}</td><td>${r.t}</td><td>${fmt(r.c,0)}</td><td>${fmt(r.k)}</td><td>${fmt(r.pr)}</td><td>${fmt(r.ft)}</td><td>${fmt(r.cb)}</td><td>${fmt(r.p)}</td><td>${fmt(r.s)}</td><td><button class="del" data-d="${r.d}">${del===r.d?'CONFIRM?':'DELETE'}</button></td></tr>`).join('')+`</table></div>`:'<div class="mu">No entries yet.</div>')+`</div>`+
    `<div class="pn"><div class="ph">BACKUP</div><div class="mu">Copy to keep a backup or paste into a spreadsheet. To import, paste rows with Date, Trained?, Calories, Creatine, Weight, Sleep, Protein, Fat and Carbs.</div><textarea id="csv" aria-label="Data as text"></textarea><button class="btn sec" id="cp">COPY DATA</button><button class="btn sec" id="im">IMPORT WHAT IS PASTED</button><div class="msg" id="m2" role="status"></div></div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{P=b.dataset.p;draw()});
  if(cur==='Data')dados();
}
function dados(){
  $('dyn').querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    if(del===b.dataset.d){D=D.filter(r=>r.d!==del);del=null;save()}else del=b.dataset.d;
    const y=window.scrollY;draw();window.scrollTo(0,y);
  });
  $('csv').value=['DATE\tTRAINED?\tCALORIES (kcal)\tCREATINE (g)\tWEIGHT (kg)\tSLEEP (h)\tPROTEIN (g)\tFAT (g)\tCARBS (g)',...D.map(r=>[r.d,r.t,r.c,r.k,r.p,r.s,r.pr,r.ft,r.cb].map(x=>x==null?'':x).join('\t'))].join('\n');
  $('cp').onclick=async()=>{const t=$('csv');
    try{await navigator.clipboard.writeText(t.value);msg($('m2'),'Data copied.')}
    catch(e){t.select();try{document.execCommand('copy');msg($('m2'),'Data copied.')}catch(x){msg($('m2'),'Select the text and copy it manually.',1)}}};
  $('im').onclick=()=>{
    let ok=0;
    for(const l of $('csv').value.split(/\r?\n/)){
      if(!l.trim())continue;
      const c=l.split(l.includes('\t')?'\t':l.includes(';')?';':',').map(x=>x.trim());
      const d=pd(c[0]),tt=/^n/i.test(c[1]||'')?'No':/^[ys]/i.test(c[1]||'')?'Yes':null;
      if(!d||!tt)continue;
      const f=x=>{const n=num(x||'');return isN(n)?n:null};
      D=D.filter(r=>r.d!==d);D.push({d,t:tt,c:f(c[2]),k:f(c[3]),p:f(c[4]),s:f(c[5]),pr:f(c[6]),ft:f(c[7]),cb:f(c[8])});ok++;
    }
    D.sort((a,b)=>a.d<b.d?-1:1);D=D.slice(-2000);save();draw();
    msg($('m2'),ok?ok+' entries imported.':'No valid rows found.',!ok);
  };
}
function pd(s){
  let m;
  if(m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if(m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  if(/^\d{5}$/.test(s))return addD('1899-12-30',+s);
  return null;
}
reset();go('Entry');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
